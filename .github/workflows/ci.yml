name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24.14.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
          cache: npm

      - name: Pin npm 11.12.1
        run: npm install --global npm@11.12.1

      - name: Set up Temurin JDK 21.0.6+7.0.LTS
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21.0.6+7.0.LTS

      - name: Install pinned Android command-line tools and SDK 36
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/commandlinetools-linux-15859902.zip"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $archive" | sha256sum --check
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools" "$RUNNER_TEMP/android-command-line-tools"
          unzip -q "$archive" -d "$RUNNER_TEMP/android-command-line-tools"
          mv "$RUNNER_TEMP/android-command-line-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          set +e
          set +o pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          set -e
          test "$license_status" -eq 0
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Install JavaScript dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify pinned environment
        run: npm run verify:n0:env

      - name: Verify TypeScript, tests and network boundary
        run: |
          npm run typecheck
          npm run test:run
          npm audit --omit=dev
          npm run verify:n0:network
          npm run e2e

      - name: Build and sync Android
        run: npm run cap:sync

      - name: Assemble debug-signed APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify merged manifest and APK
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:n0:network
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload debug-signed APK
        uses: actions/upload-artifact@v7
        with:
          name: self-improvement-tracker-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
